<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"/>
  <title>Emre 계산기</title>
  <meta name="apple-mobile-web-app-capable" content="yes"/>
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"/>
  <meta name="apple-mobile-web-app-title" content="Emre 계산기"/>
  <meta name="mobile-web-app-capable" content="yes"/>
  <meta name="theme-color" content="#0a1628"/>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' rx='20' fill='%230a1628'/><text y='.9em' font-size='80' x='10'>🌍</text></svg>"/>
  <link rel="apple-touch-icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' rx='20' fill='%230a1628'/><text y='.9em' font-size='80' x='10'>🌍</text></svg>"/>
  <link rel="manifest" href="data:application/json,%7B%22name%22%3A%22Emre%20%EA%B3%84%EC%82%B0%EA%B8%B0%22%2C%22short_name%22%3A%22Emre%22%2C%22display%22%3A%22standalone%22%2C%22background_color%22%3A%22%230a1628%22%2C%22theme_color%22%3A%22%230a1628%22%7D"/>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;600;700;800&display=swap" rel="stylesheet"/>
  <style>
    *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
    body{margin:0;padding:0;background:var(--bg);font-family:'Noto Sans KR',sans-serif;color:var(--text);transition:background 0.3s,color 0.3s;}
    :root{--bg:#0a1628;--bg2:#1e293b;--bg3:#131f2e;--text:#f1f5f9;--sub:#64748b;--border:#334155;--card:#1e293b;}
    .light{--bg:#f1f5f9;--bg2:#ffffff;--bg3:#e2e8f0;--text:#0f172a;--sub:#64748b;--border:#cbd5e1;--card:#ffffff;}
    input,button,textarea{font-family:'Noto Sans KR',sans-serif;}
    input[type=number]::-webkit-inner-spin-button,input[type=number]::-webkit-outer-spin-button{-webkit-appearance:none;}
    input[type=date]::-webkit-calendar-picker-indicator{filter:invert(0.5);opacity:0.7;}
    ::-webkit-scrollbar{display:none;}
    #toast{position:fixed;top:20px;left:50%;transform:translateX(-50%);padding:10px 22px;border-radius:30px;font-size:13px;font-weight:600;z-index:9999;box-shadow:0 4px 20px rgba(0,0,0,.4);white-space:nowrap;display:none;transition:opacity 0.3s;}
  </style>
</head>
<body>
<div id="root"></div>
<div id="toast"></div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.2.0/umd/react.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.2.0/umd/react-dom.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/babel-standalone/7.23.2/babel.min.js"></script>
<script type="text/babel">
const {useState,useEffect,useMemo,useRef}=React;

// ── Storage Keys ──
const SK="emre-records",TK="emre-templates",SK_THEME="emre-theme",SK_GOAL="emre-goal",SK_BACKUP="emre-lastbackup",SK_SCORE_CFG="emre-score-cfg";
const LEGACY=["emre-calc-v1","guide-income-records-v2","guide-income-records"];
function loadLS(key,def){try{const d=localStorage.getItem(key);if(d!=null)return JSON.parse(d);}catch{}return def;}
function saveLS(key,val){try{localStorage.setItem(key,JSON.stringify(val));}catch{}}
function loadRecords(){
  try{const d=localStorage.getItem(SK);if(d)return JSON.parse(d);}catch{}
  for(const k of LEGACY){try{const d=localStorage.getItem(k);if(d){const p=JSON.parse(d);if(p&&p.length){saveLS(SK,p);localStorage.removeItem(k);return p;}}}catch{}}
  return[];
}

// ── Utils ──
function fmt(n,cur="EUR"){
  if(cur==="EUR")return`€${Number(n||0).toLocaleString("de-DE",{minimumFractionDigits:0,maximumFractionDigits:0})}`;
  return`₩${Number(n||0).toLocaleString("ko-KR")}`;
}
function fmtDate(d){if(!d)return"";const[y,m,day]=d.split("-");return`${y}.${m}.${day}`;}
function monthKey(d){return d?d.slice(0,7):"";}
function pf(v){return parseFloat(v||0);}
function today(){return new Date().toISOString().slice(0,10);}
function clamp(v,min,max){return Math.min(Math.max(v,min),max);}

// ── 마이그레이션 ──
function migrateRecord(r,idx){
  const u={...r};
  if(!u.extraOpt)u.extraOpt=[];
  if(!u.extraShop)u.extraShop=[];
  if(!u.extraTip)u.extraTip=[];
  if(!u.extraExp)u.extraExp=[];
  if(!u.optToggle)u.optToggle={balloon:true,jeep:true,kart:true,cruise:true};
  if(!u.shopToggle)u.shopToggle={carpet:true,turquoise:true,cotton:true,leather:true,lokum:true};
  if(pf(r.optOther)>0){u.extraOpt=[...u.extraOpt,{id:r.id+1+idx,label:"기타",amount:String(r.optOther),pax:"",manualRate:""}];u.optOther="";}
  if(pf(r.otherIncome)>0){u.extraTip=[...u.extraTip,{id:r.id+2+idx,label:"기타수입",amount:String(r.otherIncome),pax:"",manualRate:""}];u.otherIncome="";}
  if(pf(r.expOther)>0){u.extraExp=[...u.extraExp,{id:r.id+3+idx,label:"기타",amount:String(r.expOther),pax:"",manualRate:""}];u.expOther="";}
  return u;
}

// ── Items ──
const OPT=[
  {key:"balloon",  label:"🎈 열기구",     rate:30,paxKey:"balloon_pax"},
  {key:"jeep",     label:"🚙 지프 사파리",rate:20,paxKey:"jeep_pax"},
  {key:"kart",     label:"🏎 카트",       rate:10,paxKey:"kart_pax"},
  {key:"cruise",   label:"⛵ 유람선",     rate:10,paxKey:"cruise_pax"},
];
const TIP_FIXED=[
  {key:"tipHoney",  label:"🍯 꿀"},
  {key:"tipMassage",label:"💆 마사지"},
  {key:"tipLamb",   label:"🥩 양갈비"},
  {key:"tipWater",  label:"💧 물값"},
];
const SHOP=[
  {key:"carpet",   label:"🪄 카페트"},
  {key:"turquoise",label:"💎 터키석"},
  {key:"cotton",   label:"👕 면제품"},
  {key:"leather",  label:"🧥 양가죽"},
  {key:"lokum",    label:"🍬 로쿰"},
];
const EXP=[
  {key:"snack",label:"🍿 주전부리"},
  {key:"drink",label:"🥤 음료"},
];

function defaultOptToggle(){return Object.fromEntries(OPT.map(i=>[i.key,true]));}
function defaultShopToggle(){return Object.fromEntries(SHOP.map(i=>[i.key,true]));}

function emptyForm(){
  return{date:today(),tourName:"",pax:"",days:"1",dailyWage:"",
    balloon:"",balloon_pax:"",jeep:"",jeep_pax:"",kart:"",kart_pax:"",cruise:"",cruise_pax:"",
    carpet:"",turquoise:"",cotton:"",leather:"",lokum:"",
    tip:"",tipHoney:"",tipMassage:"",tipLamb:"",tipWater:"",
    snack:"",drink:"",memo:"",
    extraOpt:[],extraShop:[],extraTip:[],extraExp:[],
    optToggle:defaultOptToggle(),
    shopToggle:defaultShopToggle(),
  };
}

// ── 수입 계산 ──
function tExtraOpt(r){return(r.extraOpt||[]).reduce((s,i)=>s+pf(i.amount),0);}
function tExtraShop(r){return(r.extraShop||[]).reduce((s,i)=>s+pf(i.amount),0);}
function tExtraTip(r){return(r.extraTip||[]).reduce((s,i)=>s+pf(i.amount),0);}
function tExtraExp(r){return(r.extraExp||[]).reduce((s,i)=>s+pf(i.amount),0);}
function sumKeys(r,keys){return keys.reduce((s,k)=>s+pf(r[k]),0);}
// 토글 ON된 옵션만 합산
function tOpt(r){
  const tog=r.optToggle||defaultOptToggle();
  return OPT.filter(i=>tog[i.key]!==false).reduce((s,i)=>s+pf(r[i.key]),0)+tExtraOpt(r);
}
// 토글 ON된 쇼핑만 합산
function tShop(r){
  const tog=r.shopToggle||defaultShopToggle();
  return SHOP.filter(i=>tog[i.key]!==false).reduce((s,i)=>s+pf(r[i.key]),0)+tExtraShop(r);
}
function tTip(r){return pf(r.tip)+sumKeys(r,TIP_FIXED.map(i=>i.key))+tExtraTip(r);}
function tExp(r){return sumKeys(r,EXP.map(i=>i.key))+tExtraExp(r);}
function tInc(r){return pf(r.dailyWage)+tOpt(r)+tShop(r)+tTip(r);}
function netEur(r){return tInc(r)-tExp(r);}

// ── 점수 계산 엔진 ──
const DEFAULT_SCORE_CFG={
  wOpt:30,wShop:25,wMult:15,wPerPax:10,
  movingN:10,
  bonusThreshold:150, // %
};

function calcScore(r,allRecords,cfg=DEFAULT_SCORE_CFG){
  const pax=parseInt(r.pax||0);
  if(pax===0||!r.dailyWage)return null;

  const tog=r.optToggle||defaultOptToggle();

  // ── 옵션 효율 (최대 가능 대비 실제) ──
  const maxOpt=OPT.filter(i=>tog[i.key]!==false).reduce((s,i)=>s+i.rate*pax,0);
  const actualOpt=OPT.filter(i=>tog[i.key]!==false).reduce((s,i)=>s+pf(r[i.key]),0);
  const extraOptAmt=tExtraOpt(r);
  const optEff=maxOpt>0?(actualOpt+extraOptAmt)/maxOpt*100:0; // 100% 초과 가능

  // ── 이동평균 기준점 ──
  const N=cfg.movingN||10;
  const prevRecs=[...allRecords]
    .filter(x=>x.id!==r.id&&parseInt(x.pax||0)>0&&pf(x.dailyWage)>0)
    .sort((a,b)=>b.date.localeCompare(a.date))
    .slice(0,N);
  const useAll=prevRecs.length<5;
  const baseRecs=useAll?allRecords.filter(x=>x.id!==r.id&&parseInt(x.pax||0)>0):prevRecs;

  const avgPerPaxShop=baseRecs.length>0
    ?baseRecs.reduce((s,x)=>s+tShop(x)/Math.max(parseInt(x.pax||1),1),0)/baseRecs.length:0;
  const avgPerPaxNet=baseRecs.length>0
    ?baseRecs.reduce((s,x)=>s+netEur(x)/Math.max(parseInt(x.pax||1),1),0)/baseRecs.length:0;
  const avgMult=baseRecs.length>0
    ?baseRecs.reduce((s,x)=>{const d=pf(x.dailyWage);return s+(d>0?(tOpt(x)+tShop(x)+tTip(x))/d:0);},0)/baseRecs.length:1;

  // ── 1. 옵션 효율 점수 (30점) ──
  const optScore=clamp((optEff/100)*cfg.wOpt,0,cfg.wOpt);

  // ── 2. 인당 쇼핑 점수 (25점) ──
  const perPaxShop=tShop(r)/pax;
  let shopScore=0;
  if(avgPerPaxShop>0){
    shopScore=clamp((perPaxShop/avgPerPaxShop)*cfg.wShop*0.8,0,cfg.wShop);
  } else {
    shopScore=perPaxShop>0?cfg.wShop*0.5:0;
  }

  // ── 3. 일당 부수입 배율 점수 (15점) ──
  const dailyWage=pf(r.dailyWage);
  const sideIncome=tOpt(r)+tShop(r)+tTip(r);
  const mult=dailyWage>0?sideIncome/dailyWage:0;
  let multScore=0;
  if(avgMult>0){
    multScore=clamp((mult/avgMult)*cfg.wMult*0.8,0,cfg.wMult);
  } else {
    // 절대기준 fallback: 1배=5pt, 2배=10pt, 3배=15pt
    multScore=clamp(mult/3*cfg.wMult,0,cfg.wMult);
  }

  // ── 4. 인당 순수익 점수 (10점) ──
  const perPaxNet=netEur(r)/pax;
  let perPaxScore=0;
  if(avgPerPaxNet>0){
    perPaxScore=clamp((perPaxNet/avgPerPaxNet)*cfg.wPerPax*0.8,0,cfg.wPerPax);
  } else {
    perPaxScore=perPaxNet>0?cfg.wPerPax*0.5:0;
  }

  // ── 기본점수 합계 ──
  const baseScore=optScore+shopScore+multScore+perPaxScore;

  // ── 보너스 점수 ──
  let bonus=0;
  // 옵션 100% 달성 (extraOpt 없이 기본만으로)
  if(maxOpt>0&&actualOpt>=maxOpt)bonus+=5;
  // extraOpt 추가 판매
  const extraOptCount=(r.extraOpt||[]).filter(i=>pf(i.amount)>0).length;
  bonus+=extraOptCount*5;
  // 인당 쇼핑 150% 초과
  if(avgPerPaxShop>0&&perPaxShop>=avgPerPaxShop*(cfg.bonusThreshold/100))bonus+=5;
  // 인당 순수익 150% 초과
  if(avgPerPaxNet>0&&perPaxNet>=avgPerPaxNet*(cfg.bonusThreshold/100))bonus+=5;

  const total=Math.round(baseScore+bonus);

  return{
    total,baseScore:Math.round(baseScore),bonus,
    optEff:Math.round(optEff),optScore:Math.round(optScore),
    shopScore:Math.round(shopScore),multScore:Math.round(multScore),perPaxScore:Math.round(perPaxScore),
    perPaxShop,perPaxNet,mult,
    avgPerPaxShop,avgPerPaxNet,avgMult,
    extraOptCount,maxOpt,actualOpt,extraOptAmt,
  };
}

function getGrade(score){
  if(score===null)return{label:"—",color:"#475569",emoji:"—"};
  if(score>=110)return{label:"레전드",color:"#fbbf24",emoji:"🌟"};
  if(score>=95) return{label:"마에스트로",color:"#60a5fa",emoji:"🏆"};
  if(score>=80) return{label:"프로",color:"#34d399",emoji:"⭐"};
  if(score>=75) return{label:"양호",color:"#a78bfa",emoji:"👍"};
  if(score>=60) return{label:"개선 필요",color:"#f59e0b",emoji:"📈"};
  return{label:"기초",color:"#f87171",emoji:"🔰"};
}

// ── Toast ──
function toast(msg,type="ok"){
  const el=document.getElementById("toast");
  el.textContent=msg;el.style.background=type==="err"?"#ef4444":"#10b981";el.style.color="#fff";
  el.style.display="block";el.style.opacity="1";
  setTimeout(()=>{el.style.opacity="0";setTimeout(()=>el.style.display="none",300);},2200);
}

// ── Toggle 컴포넌트 ──
function Toggle({on,onChange,color="#f59e0b"}){
  return(
    <div onClick={()=>onChange(!on)}
      style={{width:38,height:22,borderRadius:11,background:on?color:"#334155",cursor:"pointer",position:"relative",transition:"background 0.2s",flexShrink:0}}>
      <div style={{position:"absolute",top:3,left:on?18:3,width:16,height:16,borderRadius:8,background:"#fff",transition:"left 0.2s"}}/>
    </div>
  );
}

// ── Accordion ──
function Accordion({title,total,color,accent,badge,children}){
  const[open,setOpen]=useState(false);
  return(
    <div style={{marginBottom:12}}>
      <div onClick={()=>setOpen(v=>!v)} style={{display:"flex",justifyContent:"space-between",alignItems:"center",background:open?"#1a2942":"var(--card)",border:`1px solid ${open?accent||"var(--border)":"var(--border)"}`,borderRadius:open?"12px 12px 0 0":"12px",padding:"12px 14px",cursor:"pointer"}}>
        <div style={{display:"flex",alignItems:"center",gap:8}}>
          <span style={{fontSize:13,fontWeight:700,color:"var(--text)"}}>{title}</span>
          {badge&&<span style={{fontSize:10,background:"rgba(128,128,128,0.15)",borderRadius:4,padding:"1px 6px",color:"var(--sub)"}}>{badge}</span>}
        </div>
        <div style={{display:"flex",alignItems:"center",gap:8}}>
          <span style={{fontSize:14,fontWeight:800,color:total>0?color:"#475569"}}>{total>0?fmt(total):"—"}</span>
          <span style={{fontSize:13,color:"#475569",display:"inline-block",transition:"transform 0.2s",transform:open?"rotate(180deg)":"rotate(0deg)"}}>▾</span>
        </div>
      </div>
      {open&&<div style={{background:"var(--bg3)",border:`1px solid ${accent||"var(--border)"}`,borderTop:"none",borderRadius:"0 0 12px 12px",padding:"14px 14px 10px"}}>{children}</div>}
    </div>
  );
}

function InputRow({label,value,onChange,color}){
  return(
    <div style={{display:"flex",alignItems:"center",justifyContent:"space-between",marginBottom:10}}>
      <label style={{fontSize:12,color:color||"var(--sub)",fontWeight:600,minWidth:115}}>{label}</label>
      <div style={{display:"flex",alignItems:"center",gap:4}}>
        <span style={{color:"#475569",fontSize:13}}>€</span>
        <input type="number" inputMode="decimal" placeholder="0" value={value} onChange={e=>onChange(e.target.value)}
          style={{width:88,background:"var(--bg2)",border:`1px solid ${pf(value)>0?(color||"var(--border)"):"var(--border)"}`,borderRadius:8,padding:"8px 10px",color:"var(--text)",fontSize:13,outline:"none",textAlign:"right"}}/>
      </div>
    </div>
  );
}

function DetailAcc({title,total,items,rec,eurRate,color,accent}){
  const[open,setOpen]=useState(false);
  const has=items.some(i=>pf(rec[i.key])>0);
  return(
    <div style={{borderBottom:"1px solid var(--border)"}}>
      <div onClick={()=>has&&setOpen(v=>!v)} style={{display:"flex",justifyContent:"space-between",alignItems:"center",padding:"11px 0",cursor:has?"pointer":"default"}}>
        <div style={{display:"flex",alignItems:"center",gap:6}}>
          <span style={{fontSize:13,color:"var(--sub)"}}>{title}</span>
          {has&&<span style={{fontSize:10,color:"#475569",background:"var(--bg2)",borderRadius:4,padding:"1px 5px"}}>{open?"접기 ▴":"상세 ▾"}</span>}
        </div>
        <div style={{textAlign:"right"}}>
          <div style={{fontSize:13,color:total>0?color:"#475569",fontWeight:700}}>{fmt(total)}</div>
          {eurRate&&total>0&&<div style={{fontSize:10,color:"var(--sub)"}}>{fmt(total*eurRate,"KRW")}</div>}
        </div>
      </div>
      {open&&has&&(
        <div style={{background:"var(--bg3)",borderRadius:10,padding:"10px 14px",marginBottom:10,border:`1px solid ${accent||"var(--border)"}`}}>
          {items.map(item=>pf(rec[item.key])>0?(
            <div key={item.key} style={{display:"flex",justifyContent:"space-between",padding:"5px 0",borderBottom:"1px solid var(--border)"}}>
              <span style={{fontSize:12,color:"var(--sub)"}}>{item.label}</span>
              <span style={{fontSize:12,color,fontWeight:600}}>{fmt(rec[item.key])}</span>
            </div>
          ):null)}
        </div>
      )}
    </div>
  );
}

function ExtraItems({items,onChange,color,withPax=false,addLabel="+ 항목 추가"}){
  function add(){onChange([...items,{id:Date.now(),label:"",amount:"",pax:"",manualRate:""}]);}
  function remove(id){onChange(items.filter(i=>i.id!==id));}
  function update(id,field,val){
    onChange(items.map(i=>{
      if(i.id!==id)return i;
      const u={...i,[field]:val};
      if(withPax&&field==="pax"&&pf(i.manualRate)>0)u.amount=String(pf(val)*pf(i.manualRate));
      if(withPax&&field==="manualRate"&&pf(i.pax)>0)u.amount=String(pf(i.pax)*pf(val));
      return u;
    }));
  }
  return(
    <div>
      {items.map(item=>(
        <div key={item.id} style={{marginBottom:10,background:"rgba(0,0,0,0.2)",borderRadius:10,padding:"10px 12px"}}>
          <div style={{display:"flex",alignItems:"center",gap:6,marginBottom:7}}>
            <input type="text" placeholder="항목명" value={item.label} onChange={e=>update(item.id,"label",e.target.value)}
              style={{flex:1,background:"var(--bg2)",border:`1px solid ${color||"var(--border)"}`,borderRadius:7,padding:"7px 10px",color:"var(--text)",fontSize:12,outline:"none"}}/>
            <button onClick={()=>remove(item.id)} style={{background:"transparent",border:"none",color:"#ef4444",fontSize:16,cursor:"pointer",padding:"0 4px"}}>✕</button>
          </div>
          {withPax?(
            <div style={{display:"flex",alignItems:"center",gap:5}}>
              <input type="number" inputMode="numeric" placeholder="인원" value={item.pax} onChange={e=>update(item.id,"pax",e.target.value)}
                style={{width:55,background:"var(--bg2)",border:"1px solid var(--border)",borderRadius:7,padding:"7px 6px",color:"var(--text)",fontSize:12,outline:"none",textAlign:"center"}}/>
              <span style={{fontSize:11,color:"var(--sub)"}}>명 ×</span>
              <span style={{fontSize:11,color:"#475569"}}>€</span>
              <input type="number" inputMode="decimal" placeholder="단가" value={item.manualRate} onChange={e=>update(item.id,"manualRate",e.target.value)}
                style={{width:55,background:"var(--bg2)",border:"1px solid var(--border)",borderRadius:7,padding:"7px 6px",color:"var(--text)",fontSize:12,outline:"none",textAlign:"right"}}/>
              <span style={{fontSize:12,fontWeight:700,color:pf(item.amount)>0?color:"#475569",flex:1,textAlign:"right"}}>{pf(item.amount)>0?fmt(item.amount):"—"}</span>
            </div>
          ):(
            <div style={{display:"flex",alignItems:"center",gap:4}}>
              <span style={{color:"#475569",fontSize:13}}>€</span>
              <input type="number" inputMode="decimal" placeholder="0" value={item.amount} onChange={e=>update(item.id,"amount",e.target.value)}
                style={{flex:1,background:"var(--bg2)",border:`1px solid ${pf(item.amount)>0?(color||"var(--border)"):"var(--border)"}`,borderRadius:8,padding:"8px 10px",color:"var(--text)",fontSize:13,outline:"none",textAlign:"right"}}/>
            </div>
          )}
        </div>
      ))}

function BarChart({data,color="#f59e0b"}){
  const max=Math.max(...data.map(d=>d.value),1);
  return(
    <div style={{display:"flex",alignItems:"flex-end",gap:6,height:90,padding:"0 4px"}}>
      {data.map((d,i)=>(
        <div key={i} style={{flex:1,display:"flex",flexDirection:"column",alignItems:"center",gap:4}}>
          <div style={{width:"100%",background:d.color||color,borderRadius:"4px 4px 0 0",height:`${(d.value/max)*70}px`,minHeight:d.value>0?4:0,opacity:0.85}}/>
          <span style={{fontSize:9,color:"#9ca3af",whiteSpace:"nowrap"}}>{d.label}</span>
        </div>
      ))}
    </div>
  );
}

function PieChart({data}){
  if(!data.length)return<div style={{textAlign:"center",color:"var(--sub)",padding:20}}>데이터 없음</div>;
  const total=data.reduce((s,d)=>s+d.value,0);
  let cum=-Math.PI/2;
  const slices=data.map(d=>{
    const angle=(d.value/total)*2*Math.PI;
    const x1=50+45*Math.cos(cum),y1=50+45*Math.sin(cum);
    cum+=angle;
    const x2=50+45*Math.cos(cum),y2=50+45*Math.sin(cum);
    const large=angle>Math.PI?1:0;
    const path=data.length===1?`M50,5 A45,45,0,1,1,49.99,5 Z`:`M50,50 L${x1},${y1} A45,45,0,${large},1,${x2},${y2} Z`;
    return{...d,path};
  });
  return(
    <div style={{display:"flex",alignItems:"center",gap:16}}>
      <svg viewBox="0 0 100 100" style={{width:120,height:120,flexShrink:0}}>
        {slices.map((s,i)=><path key={i} d={s.path} fill={s.color} opacity={0.9}/>)}
      </svg>
      <div style={{flex:1}}>
        {data.map((d,i)=>(
          <div key={i} style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:7}}>
            <div style={{display:"flex",alignItems:"center",gap:6}}>
              <div style={{width:9,height:9,borderRadius:2,background:d.color,flexShrink:0}}/>
              <span style={{fontSize:11,color:"var(--sub)"}}>{d.label}</span>
            </div>
            <div style={{textAlign:"right"}}>
              <span style={{fontSize:11,fontWeight:700,color:d.color}}>{Math.round(d.value/total*100)}%</span>
              <div style={{fontSize:10,color:"var(--sub)"}}>{fmt(d.value)}</div>
            </div>
          </div>
        ))}
      </div>
    </div>
  );
}

              <div style={{textAlign:"right"}}>
                <div style={{fontSize:13,color:"#60a5fa",fontWeight:700}}>{fmt(detailRec.dailyWage||0)}</div>

            <DetailAcc title="⭐ 옵션 인센티브" total={tOpt(detailRec)}
              items={[...OPT.filter(i=>tog[i.key]!==false).map(i=>({...i,label:`${i.label}(${pf(detailRec[i.paxKey])||0}명×€${i.rate})`})),...(detailRec.extraOpt||[]).map(i=>({key:`x_${i.id}`,label:`⭐ ${i.label||"추가옵션"}`}))]}
              rec={{...detailRec,...Object.fromEntries((detailRec.extraOpt||[]).map(i=>[`x_${i.id}`,i.amount]))}}

            <DetailAcc title="🛍 쇼핑 인센티브" total={tShop(detailRec)}
              items={[...SHOP.filter(i=>shopTog[i.key]!==false),...(detailRec.extraShop||[]).map(i=>({key:`x_${i.id}`,label:`🛍 ${i.label||"추가쇼핑"}`}))]}
              rec={{...detailRec,...Object.fromEntries((detailRec.extraShop||[]).map(i=>[`x_${i.id}`,i.amount]))}}

            <DetailAcc title="💝 TIP / 기타" total={tTip(detailRec)}

              rec={{...detailRec,...Object.fromEntries((detailRec.extraTip||[]).map(i=>[`x_${i.id}`,i.amount]))}}
              eurRate={eurRate} color="#34d399" accent="#059669"/>
            <DetailAcc title="📤 지출 / 경비" total={tExp(detailRec)}
              items={[...EXP,...(detailRec.extraExp||[]).map(i=>({key:`x_${i.id}`,label:i.label||"추가지출"}))]}
              rec={{...detailRec,...Object.fromEntries((detailRec.extraExp||[]).map(i=>[`x_${i.id}`,i.amount]))}}

      {/* ══ STATS ══ */}
      {view==="stats"&&(()=>{
        // 점수 데이터
        const scoredRecs=[...records].filter(r=>parseInt(r.pax||0)>0&&pf(r.dailyWage)>0)
          .sort((a,b)=>a.date.localeCompare(b.date))
          .map(r=>({...r,sc:calcScore(r,records,scoreCfg)}))
          .filter(r=>r.sc);
        const avgScore=scoredRecs.length>0?Math.round(scoredRecs.reduce((s,r)=>s+r.sc.total,0)/scoredRecs.length):0;
        const bestRec=scoredRecs.reduce((best,r)=>!best||r.sc.total>best.sc.total?r:best,null);
        const recentScores=scoredRecs.slice(-8);

        // 월별 평균 점수
        const monthScores=months.slice(0,6).map(m=>{
          const recs=scoredRecs.filter(r=>monthKey(r.date)===m);
          const avg=recs.length>0?Math.round(recs.reduce((s,r)=>s+r.sc.total,0)/recs.length):0;
          return{label:`${parseInt(m.slice(5))}월`,value:avg,color:getGrade(avg).color};
        }).reverse();

        // 옵션 효율 추이
        const optEffTrend=scoredRecs.slice(-8).map(r=>({label:fmtDate(r.date).slice(5),value:r.sc.optEff,color:r.sc.optEff>=100?"#34d399":r.sc.optEff>=70?"#fbbf24":"#f87171"}));

        // 파이 데이터
        const pieData=[
          {label:"💼 일당",  value:records.reduce((s,r)=>s+pf(r.dailyWage),0),color:"#60a5fa"},
          {label:"⭐ 옵션",  value:records.reduce((s,r)=>s+tOpt(r),0),         color:"#fbbf24"},
          {label:"🛍 쇼핑",  value:records.reduce((s,r)=>s+tShop(r),0),        color:"#a78bfa"},
          {label:"💝 팁/기타",value:records.reduce((s,r)=>s+tTip(r),0),        color:"#34d399"},
        ].filter(d=>d.value>0);

        const totalPax=records.reduce((s,r)=>s+parseInt(r.pax||0),0);
        const perPax=totalPax>0?Math.round(records.reduce((s,r)=>s+netEur(r),0)/totalPax):0;
        const thisYear=new Date().getFullYear();
        const tyRecs=records.filter(r=>r.date?.startsWith(String(thisYear)));
        const lyRecs=records.filter(r=>r.date?.startsWith(String(thisYear-1)));
        const tyPax=tyRecs.reduce((s,r)=>s+parseInt(r.pax||0),0);
        const lyPax=lyRecs.reduce((s,r)=>s+parseInt(r.pax||0),0);
        const tyPerPax=tyPax>0?Math.round(tyRecs.reduce((s,r)=>s+netEur(r),0)/tyPax):0;
        const lyPerPax=lyPax>0?Math.round(lyRecs.reduce((s,r)=>s+netEur(r),0)/lyPax):0;

        // 투어별 평균
        const tourMap={};
        records.forEach(r=>{if(!tourMap[r.tourName])tourMap[r.tourName]={name:r.tourName,count:0,net:0,pax:0};tourMap[r.tourName].count++;tourMap[r.tourName].net+=netEur(r);tourMap[r.tourName].pax+=parseInt(r.pax||0);});
        const tourRank=Object.values(tourMap).sort((a,b)=>b.net-a.net).slice(0,8);

            {[
              {key:"movingN",label:"이동평균 기준 투어 수",min:5,max:20,unit:"개"},
              {key:"wOpt",label:"옵션 효율 배점",min:10,max:40,unit:"점"},
              {key:"wShop",label:"인당 쇼핑 배점",min:10,max:35,unit:"점"},
              {key:"wMult",label:"부수입 배율 배점",min:5,max:25,unit:"점"},
              {key:"wPerPax",label:"인당 순수익 배점",min:5,max:20,unit:"점"},
              {key:"bonusThreshold",label:"보너스 임계값",min:110,max:200,unit:"%"},
            ].map(({key,label,min,max,unit})=>(
              <div key={key} style={{marginBottom:12}}>
                <div style={{display:"flex",justifyContent:"space-between",marginBottom:4}}>
                  <span style={{fontSize:12,color:"var(--sub)"}}>{label}</span>
                  <span style={{fontSize:12,color:"#f59e0b",fontWeight:700}}>{scoreCfg[key]}{unit}</span>
                </div>
                <input type="range" min={min} max={max} value={scoreCfg[key]}
                  onChange={e=>setScoreCfg(c=>({...c,[key]:parseInt(e.target.value)}))}
                  style={{width:"100%",accentColor:"#f59e0b"}}/>
              </div>
            ))}
            <button onClick={()=>setScoreCfg(DEFAULT_SCORE_CFG)} style={{width:"100%",background:"transparent",border:"1px solid var(--border)",borderRadius:8,padding:"8px",color:"var(--sub)",fontSize:12,cursor:"pointer",marginTop:4}}>기본값으로 초기화</button>
          </div>

          {/* 데이터 관리 */}
          <div style={{background:"var(--card)",borderRadius:14,padding:"14px 16px",border:"1px solid var(--border)",marginBottom:12}}>
            <div style={{fontSize:14,fontWeight:700,color:"var(--text)",marginBottom:12}}>💾 데이터 관리</div>
            <div style={{display:"flex",gap:8,flexWrap:"wrap"}}>
              <button onClick={exportJSON} style={{flex:1,background:"#1e3a5f",border:"1px solid #2d4a6b",borderRadius:10,padding:"10px",color:"#60a5fa",fontSize:12,cursor:"pointer",fontWeight:600}}>📤 백업 저장</button>
              <label style={{flex:1,background:"#1e3a5f",border:"1px solid #2d4a6b",borderRadius:10,padding:"10px",color:"#34d399",fontSize:12,cursor:"pointer",fontWeight:600,textAlign:"center"}}>
                📥 가져오기<input type="file" accept=".json,.csv" onChange={importFile} style={{display:"none"}}/>
              </label>
            </div>
            <button onClick={exportCSV} style={{width:"100%",marginTop:8,background:"transparent",border:"1px solid var(--border)",borderRadius:10,padding:"10px",color:"var(--sub)",fontSize:12,cursor:"pointer"}}>📊 CSV 내보내기</button>
            <div style={{fontSize:10,color:"var(--sub)",marginTop:10,textAlign:"center"}}>총 {records.length}개 기록 저장됨</div>
          </div>

          <div style={{background:"var(--card)",borderRadius:14,padding:"14px 16px",border:"1px solid var(--border)"}}>
            <div style={{fontSize:14,fontWeight:700,color:"var(--text)",marginBottom:8}}>ℹ️ 앱 정보</div>
            <div style={{fontSize:12,color:"var(--sub)",lineHeight:1.8}}>
              <div>🌍 Emre 계산기 v4.0</div>
              <div>🔒 모든 데이터는 이 기기에만 저장</div>
              <div>💱 환율: 유럽중앙은행 기준 (1일 1회)</div>
              <div>🏆 점수: 최근 {scoreCfg.movingN}개 이동평균 기준</div>
            </div>
          </div>
        </div>
      )}

      {isListLike&&<button style={{position:"fixed",bottom:70,right:"calc(50% - 200px)",background:"linear-gradient(135deg,#f59e0b,#d97706)",border:"none",borderRadius:28,width:52,height:52,fontSize:24,color:"#0f172a",cursor:"pointer",display:"flex",alignItems:"center",justifyContent:"center",boxShadow:"0 4px 20px rgba(245,158,11,0.4)",zIndex:99}} onClick={openAdd}>＋</button>}

      <div style={{position:"fixed",bottom:0,left:"50%",transform:"translateX(-50%)",width:"100%",maxWidth:430,background:"var(--bg)",borderTop:"1px solid var(--border)",display:"flex",zIndex:100}}>
        {[{id:"list",icon:"📋",label:"기록"},{id:"stats",icon:"📈",label:"통계"},{id:"settings",icon:"⚙️",label:"설정"}].map(({id,icon,label})=>{
          const active=view===id||(view==="detail"&&id==="list")||(view==="add"&&id==="list");
          return(
            <button key={id} style={{flex:1,padding:"10px 0 8px",display:"flex",flexDirection:"column",alignItems:"center",gap:3,cursor:"pointer",border:"none",background:"transparent",color:active?"#f59e0b":"var(--sub)",fontSize:10,fontWeight:active?700:400}} onClick={()=>setView(id)}>
              <span style={{fontSize:20}}>{icon}</span><span>{label}</span>
            </button>
          );
        })}
      </div>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App/>);
</script>
<script>
if("serviceWorker"in navigator){
  const sw=`const C="emre-v4";self.addEventListener("install",e=>{self.skipWaiting();});self.addEventListener("activate",e=>{e.waitUntil(caches.keys().then(k=>Promise.all(k.filter(n=>n!==C).map(n=>caches.delete(n)))));self.clients.claim();});self.addEventListener("fetch",e=>{e.respondWith(fetch(e.request).catch(()=>caches.match(e.request)));});`;
  const blob=new Blob([sw],{type:"application/javascript"});
  navigator.serviceWorker.register(URL.createObjectURL(blob)).catch(()=>{});
}
</script>
</body>
</html>
