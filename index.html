<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"/>
  <title>Emre 계산기</title>
  <meta name="apple-mobile-web-app-capable" content="yes"/>
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"/>
  <meta name="apple-mobile-web-app-title" content="Emre 계산기"/>
  <meta name="mobile-web-app-capable" content="yes"/>
  <meta name="theme-color" content="#0a1628"/>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' rx='20' fill='%230a1628'/><text y='.9em' font-size='80' x='10'>🌍</text></svg>"/>
  <link rel="apple-touch-icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' rx='20' fill='%230a1628'/><text y='.9em' font-size='80' x='10'>🌍</text></svg>"/>
  <link rel="manifest" href="data:application/json,%7B%22name%22%3A%22Emre%20%EA%B3%84%EC%82%B0%EA%B8%B0%22%2C%22short_name%22%3A%22Emre%22%2C%22display%22%3A%22standalone%22%2C%22background_color%22%3A%22%230a1628%22%2C%22theme_color%22%3A%22%230a1628%22%7D"/>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;600;700;800&display=swap" rel="stylesheet"/>
  <style>
    *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
    body{margin:0;padding:0;background:var(--bg);font-family:'Noto Sans KR',sans-serif;color:var(--text);transition:background 0.3s,color 0.3s;}
    :root{--bg:#0a1628;--bg2:#1e293b;--bg3:#131f2e;--text:#f1f5f9;--sub:#64748b;--border:#334155;--card:#1e293b;}
    .light{--bg:#f1f5f9;--bg2:#ffffff;--bg3:#e2e8f0;--text:#0f172a;--sub:#64748b;--border:#cbd5e1;--card:#ffffff;}
    input,button,textarea,select{font-family:'Noto Sans KR',sans-serif;}
    input[type=number]::-webkit-inner-spin-button,input[type=number]::-webkit-outer-spin-button{-webkit-appearance:none;}
    input[type=date]::-webkit-calendar-picker-indicator{filter:invert(0.5);opacity:0.7;}
    ::-webkit-scrollbar{display:none;}
    #toast{position:fixed;top:20px;left:50%;transform:translateX(-50%);padding:10px 22px;border-radius:30px;font-size:13px;font-weight:600;z-index:9999;box-shadow:0 4px 20px rgba(0,0,0,.4);white-space:nowrap;display:none;transition:opacity 0.3s;}
  </style>
</head>
<body>
<div id="root"></div>
<div id="toast"></div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.2.0/umd/react.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.2.0/umd/react-dom.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/babel-standalone/7.23.2/babel.min.js"></script>
<script type="text/babel">
const {useState,useEffect,useMemo,useRef}=React;

// ── Storage ──
const SK="emre-records", TK="emre-templates", SK_THEME="emre-theme", SK_GOAL="emre-goal", SK_BACKUP="emre-lastbackup";
const LEGACY=["emre-calc-v1","guide-income-records-v2","guide-income-records"];
function loadLS(key,def){
  try{const d=localStorage.getItem(key);if(d!=null)return JSON.parse(d);}catch{}
  return def;
}
function saveLS(key,val){try{localStorage.setItem(key,JSON.stringify(val));}catch{}}
function loadRecords(){
  try{const d=localStorage.getItem(SK);if(d)return JSON.parse(d);}catch{}
  for(const k of LEGACY){try{const d=localStorage.getItem(k);if(d){const p=JSON.parse(d);if(p&&p.length){saveLS(SK,p);localStorage.removeItem(k);return p;}}}catch{}}
  return[];
}

// ── Utils ──
function fmt(n,cur="EUR"){
  if(cur==="EUR")return`€${Number(n||0).toLocaleString("de-DE",{minimumFractionDigits:0,maximumFractionDigits:0})}`;
  return`₩${Number(n||0).toLocaleString("ko-KR")}`;
}
function fmtDate(d){if(!d)return"";const[y,m,day]=d.split("-");return`${y}.${m}.${day}`;}
function monthKey(d){return d?d.slice(0,7):"";}
function pf(v){return parseFloat(v||0);}
function today(){return new Date().toISOString().slice(0,10);}

// ── 구버전 데이터 마이그레이션 ──
function migrateRecord(r,idx){
  const updated={...r};
  if(!updated.extraOpt) updated.extraOpt=[];
  if(!updated.extraShop) updated.extraShop=[];
  if(!updated.extraTip) updated.extraTip=[];
  if(!updated.extraExp) updated.extraExp=[];
  // optOther → extraOpt
  if(pf(r.optOther)>0){
    updated.extraOpt=[...updated.extraOpt,{id:r.id+1+idx,label:"기타",amount:String(r.optOther),pax:"",manualRate:""}];
    updated.optOther="";
  }
  // otherIncome → extraTip
  if(pf(r.otherIncome)>0){
    updated.extraTip=[...updated.extraTip,{id:r.id+2+idx,label:"기타수입",amount:String(r.otherIncome),pax:"",manualRate:""}];
    updated.otherIncome="";
  }
  // expOther → extraExp
  if(pf(r.expOther)>0){
    updated.extraExp=[...updated.extraExp,{id:r.id+3+idx,label:"기타",amount:String(r.expOther),pax:"",manualRate:""}];
    updated.expOther="";
  }
  return updated;
}

// ── Items ──
const OPT=[
  {key:"jeep",     label:"🚙 지프 사파리",rate:20,paxKey:"jeep_pax"},
  {key:"kart",     label:"🏎 카트",       rate:10,paxKey:"kart_pax"},
  {key:"cruise",   label:"⛵ 유람선",     rate:10,paxKey:"cruise_pax"},
];
const SHOP=[
  {key:"carpet",   label:"🪄 카페트"},
  {key:"turquoise",label:"💎 터키석"},
  {key:"cotton",   label:"👕 면제품"},
  {key:"leather",  label:"🧥 양가죽"},
  {key:"lokum",    label:"🍬 로쿰"},
];
const EXP=[
  {key:"snack",    label:"🍿 주전부리"},
  {key:"drink",    label:"🥤 음료"},
];

function emptyForm(){
  return{date:today(),tourName:"",pax:"",days:"1",dailyWage:"",
    balloon:"",balloon_pax:"",jeep:"",jeep_pax:"",kart:"",kart_pax:"",cruise:"",cruise_pax:"",
    carpet:"",turquoise:"",cotton:"",leather:"",lokum:"",
    tip:"",snack:"",drink:"",memo:"",
    extraOpt:[],extraShop:[],extraTip:[],extraExp:[],
  };
}
// 추가항목 합계
function tExtraOpt(r){return(r.extraOpt||[]).reduce((s,i)=>s+pf(i.amount),0);}
function tExtraShop(r){return(r.extraShop||[]).reduce((s,i)=>s+pf(i.amount),0);}
function tExtraTip(r){return(r.extraTip||[]).reduce((s,i)=>s+pf(i.amount),0);}
function tExtraExp(r){return(r.extraExp||[]).reduce((s,i)=>s+pf(i.amount),0);}
function sumKeys(r,keys){return keys.reduce((s,k)=>s+pf(r[k]),0);}
function tOpt(r){return sumKeys(r,OPT.map(i=>i.key))+tExtraOpt(r);}
function tShop(r){return sumKeys(r,SHOP.map(i=>i.key))+tExtraShop(r);}
function tTip(r){return pf(r.tip)+tExtraTip(r);}
function tExp(r){return sumKeys(r,EXP.map(i=>i.key))+tExtraExp(r);}
function tInc(r){return pf(r.dailyWage)+tOpt(r)+tShop(r)+tTip(r);}
function netEur(r){return tInc(r)-tExp(r);}

// ── 동적 추가 항목 입력 컴포넌트 ──
function ExtraItems({items,onChange,color,withPax=false,paxRate=null,addLabel="+ 항목 추가"}){
  function add(){onChange([...items,{id:Date.now(),label:"",amount:"",pax:""}]);}
  function remove(id){onChange(items.filter(i=>i.id!==id));}
  function update(id,field,val){
    onChange(items.map(i=>{
      if(i.id!==id)return i;
      const updated={...i,[field]:val};
      // 인원+단가 자동계산
      if(withPax&&paxRate&&(field==="pax")){
        updated.amount=pf(val)*paxRate>0?String(pf(val)*paxRate):"";
      }
      return updated;
    }));
  }
  return(
    <div>
      {items.map(item=>(
        <div key={item.id} style={{marginBottom:10,background:"rgba(0,0,0,0.2)",borderRadius:10,padding:"10px 12px"}}>
          <div style={{display:"flex",alignItems:"center",gap:6,marginBottom:7}}>
            <input type="text" placeholder="항목명" value={item.label} onChange={e=>update(item.id,"label",e.target.value)}
              style={{flex:1,background:"var(--bg2)",border:`1px solid ${color||"var(--border)"}`,borderRadius:7,padding:"7px 10px",color:"var(--text)",fontSize:12,outline:"none"}}/>
            <button onClick={()=>remove(item.id)} style={{background:"transparent",border:"none",color:"#ef4444",fontSize:16,cursor:"pointer",padding:"0 4px",flexShrink:0}}>✕</button>
          </div>
          {withPax?(
            <div style={{display:"flex",alignItems:"center",gap:6}}>
              <div style={{display:"flex",alignItems:"center",gap:3,flex:1}}>
                <input type="number" inputMode="numeric" placeholder="인원" value={item.pax} onChange={e=>update(item.id,"pax",e.target.value)}
                  style={{width:60,background:"var(--bg2)",border:`1px solid var(--border)`,borderRadius:7,padding:"7px 8px",color:"var(--text)",fontSize:12,outline:"none",textAlign:"center"}}/>
                <span style={{fontSize:11,color:"var(--sub)"}}>명</span>
              </div>
              <span style={{fontSize:11,color:"#475569"}}>×</span>
              <div style={{display:"flex",alignItems:"center",gap:3,flex:1}}>
                <span style={{color:"#475569",fontSize:12}}>€</span>
                <input type="number" inputMode="decimal" placeholder="단가" value={paxRate||item.manualRate||""} readOnly={!!paxRate}
                  onChange={e=>!paxRate&&update(item.id,"manualRate",e.target.value)}
                  style={{flex:1,background:"var(--bg2)",border:`1px solid var(--border)`,borderRadius:7,padding:"7px 8px",color:"var(--text)",fontSize:12,outline:"none",textAlign:"right",opacity:paxRate?0.5:1}}/>
              </div>
              <span style={{fontSize:12,fontWeight:700,color:pf(item.pax)>0?color:"#475569",minWidth:48,textAlign:"right"}}>
                {pf(item.pax)>0?fmt(pf(item.pax)*(paxRate||pf(item.manualRate))):"—"}
              </span>
            </div>
          ):(
            <div style={{display:"flex",alignItems:"center",gap:4}}>
              <span style={{color:"#475569",fontSize:13}}>€</span>
              <input type="number" inputMode="decimal" placeholder="0" value={item.amount} onChange={e=>update(item.id,"amount",e.target.value)}
                style={{flex:1,background:"var(--bg2)",border:`1px solid ${pf(item.amount)>0?(color||"var(--border)"):"var(--border)"}`,borderRadius:8,padding:"8px 10px",color:"var(--text)",fontSize:13,outline:"none",textAlign:"right"}}/>
            </div>
          )}
        </div>
      ))}
      <button onClick={add} style={{width:"100%",background:"transparent",border:`1px dashed ${color||"var(--border)"}`,borderRadius:9,padding:"8px",color:color||"var(--sub)",fontSize:12,fontWeight:600,cursor:"pointer",marginTop:4}}>
        {addLabel}
      </button>
    </div>
  );
}
function toast(msg,type="ok"){
  const el=document.getElementById("toast");
  el.textContent=msg;el.style.background=type==="err"?"#ef4444":"#10b981";el.style.color="#fff";
  el.style.display="block";el.style.opacity="1";
  setTimeout(()=>{el.style.opacity="0";setTimeout(()=>el.style.display="none",300);},2200);
}

// ── Components ──
function Accordion({title,total,color,accent,badge,children,defaultOpen=false}){
  const[open,setOpen]=useState(defaultOpen);
  const isDark=document.body.classList.contains("light")?false:true;
  return(
    <div style={{marginBottom:12}}>
      <div onClick={()=>setOpen(v=>!v)} style={{display:"flex",justifyContent:"space-between",alignItems:"center",background:open?"#1a2942":"var(--card)",border:`1px solid ${open?accent||"var(--border)":"var(--border)"}`,borderRadius:open?"12px 12px 0 0":"12px",padding:"12px 14px",cursor:"pointer"}}>
        <div style={{display:"flex",alignItems:"center",gap:8}}>
          <span style={{fontSize:13,fontWeight:700,color:"var(--text)"}}>{title}</span>
          {badge&&<span style={{fontSize:10,background:"rgba(128,128,128,0.15)",borderRadius:4,padding:"1px 6px",color:"var(--sub)"}}>{badge}</span>}
        </div>
        <div style={{display:"flex",alignItems:"center",gap:8}}>
          <span style={{fontSize:14,fontWeight:800,color:total>0?color:"#475569"}}>{total>0?fmt(total):"—"}</span>
          <span style={{fontSize:13,color:"#475569",display:"inline-block",transition:"transform 0.2s",transform:open?"rotate(180deg)":"rotate(0deg)"}}>▾</span>
        </div>
      </div>
      {open&&<div style={{background:"var(--bg3)",border:`1px solid ${accent||"var(--border)"}`,borderTop:"none",borderRadius:"0 0 12px 12px",padding:"14px 14px 10px"}}>{children}</div>}
    </div>
  );
}

function InputRow({label,value,onChange,color}){
  return(
    <div style={{display:"flex",alignItems:"center",justifyContent:"space-between",marginBottom:10}}>
      <label style={{fontSize:12,color:color||"var(--sub)",fontWeight:600,minWidth:115}}>{label}</label>
      <div style={{display:"flex",alignItems:"center",gap:4}}>
        <span style={{color:"#475569",fontSize:13}}>€</span>
        <input type="number" inputMode="decimal" placeholder="0" value={value} onChange={e=>onChange(e.target.value)}
          style={{width:88,background:"var(--bg2)",border:`1px solid ${pf(value)>0?(color||"var(--border)"):"var(--border)"}`,borderRadius:8,padding:"8px 10px",color:"var(--text)",fontSize:13,outline:"none",textAlign:"right"}}/>
      </div>
    </div>
  );
}

function DetailAcc({title,total,items,rec,eurRate,color,accent}){
  const[open,setOpen]=useState(false);
  const has=items.some(i=>pf(rec[i.key])>0);
  return(
    <div style={{borderBottom:"1px solid var(--border)"}}>
      <div onClick={()=>has&&setOpen(v=>!v)} style={{display:"flex",justifyContent:"space-between",alignItems:"center",padding:"11px 0",cursor:has?"pointer":"default"}}>
        <div style={{display:"flex",alignItems:"center",gap:6}}>
          <span style={{fontSize:13,color:"var(--sub)"}}>{title}</span>
          {has&&<span style={{fontSize:10,color:"#475569",background:"var(--bg2)",borderRadius:4,padding:"1px 5px"}}>{open?"접기 ▴":"상세 ▾"}</span>}
        </div>
        <div style={{textAlign:"right"}}>
          <div style={{fontSize:13,color:total>0?color:"#475569",fontWeight:700}}>{fmt(total)}</div>
          {eurRate&&total>0&&<div style={{fontSize:10,color:"var(--sub)"}}>{fmt(total*eurRate,"KRW")}</div>}
        </div>
      </div>
      {open&&has&&(
        <div style={{background:"var(--bg3)",borderRadius:10,padding:"10px 14px",marginBottom:10,border:`1px solid ${accent||"var(--border)"}`}}>
          {items.map(item=>pf(rec[item.key])>0?(
            <div key={item.key} style={{display:"flex",justifyContent:"space-between",padding:"5px 0",borderBottom:"1px solid var(--border)"}}>
              <span style={{fontSize:12,color:"var(--sub)"}}>{item.label}</span>
              <span style={{fontSize:12,color,fontWeight:600}}>{fmt(rec[item.key])}</span>
            </div>
          ):null)}
        </div>
      )}
    </div>
  );
}

function BarChart({data}){
  const max=Math.max(...data.map(d=>d.value),1);
  return(
    <div style={{display:"flex",alignItems:"flex-end",gap:6,height:90,padding:"0 4px"}}>
      {data.map((d,i)=>(
        <div key={i} style={{flex:1,display:"flex",flexDirection:"column",alignItems:"center",gap:4}}>
          <div style={{width:"100%",background:"#f59e0b",borderRadius:"4px 4px 0 0",height:`${(d.value/max)*70}px`,minHeight:d.value>0?4:0,opacity:0.85}}/>
          <span style={{fontSize:9,color:"#9ca3af",whiteSpace:"nowrap"}}>{d.label}</span>
        </div>
      ))}
    </div>
  );
}

function PieChart({data}){
  if(!data.length)return<div style={{textAlign:"center",color:"#475569",padding:20}}>데이터 없음</div>;
  const total=data.reduce((s,d)=>s+d.value,0);
  let cum=-Math.PI/2;
  const slices=data.map(d=>{
    const angle=(d.value/total)*2*Math.PI;
    const x1=50+45*Math.cos(cum),y1=50+45*Math.sin(cum);
    cum+=angle;
    const x2=50+45*Math.cos(cum),y2=50+45*Math.sin(cum);
    const large=angle>Math.PI?1:0;
    const path=data.length===1?`M50,5 A45,45,0,1,1,49.99,5 Z`:`M50,50 L${x1},${y1} A45,45,0,${large},1,${x2},${y2} Z`;
    return{...d,path};
  });
  return(
    <div style={{display:"flex",alignItems:"center",gap:16}}>
      <svg viewBox="0 0 100 100" style={{width:120,height:120,flexShrink:0}}>
        {slices.map((s,i)=><path key={i} d={s.path} fill={s.color} opacity={0.9}/>)}
      </svg>
      <div style={{flex:1}}>
        {data.map((d,i)=>(
          <div key={i} style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:7}}>
            <div style={{display:"flex",alignItems:"center",gap:6}}>
              <div style={{width:9,height:9,borderRadius:2,background:d.color,flexShrink:0}}/>
              <span style={{fontSize:11,color:"var(--sub)"}}>{d.label}</span>
            </div>
            <div style={{textAlign:"right"}}>
              <span style={{fontSize:11,fontWeight:700,color:d.color}}>{Math.round(d.value/total*100)}%</span>
              <div style={{fontSize:10,color:"var(--sub)"}}>{fmt(d.value)}</div>
            </div>
          </div>
        ))}
      </div>
    </div>
  );
}

// ════════════════════════════════
// MAIN APP
// ════════════════════════════════
function App(){
  const[records,setRecords]=useState([]);
  const[templates,setTemplates]=useState([]);
  const[eurRate,setEurRate]=useState(null);
  const[rateLoading,setRateLoading]=useState(false);
  const[view,setView]=useState("list");
  const[editId,setEditId]=useState(null);
  const[filterMonth,setFilterMonth]=useState("");
  const[form,setForm]=useState(emptyForm());
  const[detailId,setDetailId]=useState(null);
  const[darkMode,setDarkMode]=useState(true);
  const[monthGoal,setMonthGoal]=useState(0);
  const[showGoalInput,setShowGoalInput]=useState(false);
  const[statTab,setStatTab]=useState("overview");
  const[showTemplates,setShowTemplates]=useState(false);
  const fileRef=useRef();

  // init
  useEffect(()=>{
    setRecords(loadRecords().map((r,i)=>migrateRecord(r,i)));
    setTemplates(loadLS(TK,[]));
    setMonthGoal(loadLS(SK_GOAL,0));
    const th=loadLS(SK_THEME,true);
    setDarkMode(th);
    if(!th)document.body.classList.add("light");
    fetchRate();
    // 백업 알림 (30일마다)
    const last=loadLS(SK_BACKUP,null);
    if(last){
      const days=Math.floor((Date.now()-last)/(1000*60*60*24));
      if(days>=30)setTimeout(()=>toast("💾 30일이 지났어요! 백업을 권장합니다","ok"),3000);
    }
  },[]);
  useEffect(()=>{saveLS(SK,records);},[records]);
  useEffect(()=>{saveLS(TK,templates);},[templates]);
  useEffect(()=>{
    document.body.classList.toggle("light",!darkMode);
    saveLS(SK_THEME,darkMode);
  },[darkMode]);

  async function fetchRate(){
    setRateLoading(true);
    try{
      const res=await fetch("https://cdn.jsdelivr.net/npm/@fawazahmed0/currency-api@latest/v1/currencies/eur.json");
      const data=await res.json();
      const r=data?.eur?.krw;
      if(r&&r>100){setEurRate(Math.round(r));setRateLoading(false);return;}
    }catch{}
    try{
      const res=await fetch("https://latest.currency-api.pages.dev/v1/currencies/eur.json");
      const data=await res.json();
      const r=data?.eur?.krw;
      if(r&&r>100)setEurRate(Math.round(r));
    }catch{}
    setRateLoading(false);
  }

  function setF(key){return v=>setForm(f=>({...f,[key]:v}));}
  function openAdd(){setForm(emptyForm());setEditId(null);setView("add");setShowTemplates(false);}
  function openEdit(rec){setForm({...emptyForm(),...rec});setEditId(rec.id);setView("add");}

  // 템플릿 저장
  function saveTemplate(){
    if(!form.tourName){toast("투어명을 입력해주세요","err");return;}
    const tmpl={id:Date.now(),name:form.tourName,data:{...form,date:today(),memo:""}};
    setTemplates(t=>[tmpl,...t.slice(0,9)]);
    toast(`"${form.tourName}" 템플릿 저장 ✓`);
  }
  function loadTemplate(tmpl){
    setForm({...tmpl.data,date:today()});
    setShowTemplates(false);
    toast(`"${tmpl.name}" 템플릿 불러오기 ✓`);
  }
  function deleteTemplate(id){
    setTemplates(t=>t.filter(x=>x.id!==id));
    toast("템플릿 삭제 ✓");
  }

  function saveRecord(){
    if(!form.date||!form.tourName){toast("날짜와 투어명은 필수입니다","err");return;}
    if(editId){setRecords(r=>r.map(x=>x.id===editId?{...form,id:editId}:x));toast("수정되었습니다 ✓");}
    else{setRecords(r=>[...r,{...form,id:Date.now()}]);toast("추가되었습니다 ✓");}
    setView("list");setEditId(null);
  }
  function deleteRecord(id){
    if(!window.confirm("삭제할까요?"))return;

  function exportCSV(){
    const h=["날짜","투어명","인원","일수","일당(EUR)",...OPT.map(i=>i.rate?`옵션-${i.label}인원`:`옵션-${i.label}EUR`),...OPT.filter(i=>i.rate).map(i=>`옵션-${i.label}EUR`),...SHOP.map(i=>`쇼핑-${i.label}EUR`),"TIP","기타수입",...EXP.map(i=>`지출-${i.label}EUR`),"메모","총수입","총지출","순수익"];
    const rows=filtered.map(r=>[r.date,r.tourName,r.pax,r.days||1,r.dailyWage||0,...OPT.map(i=>i.rate?(r[i.paxKey]||0):(r[i.key]||0)),...OPT.filter(i=>i.rate).map(i=>r[i.key]||0),...SHOP.map(i=>r[i.key]||0),r.tip||0,r.otherIncome||0,...EXP.map(i=>r[i.key]||0),r.memo,tInc(r),tExp(r),netEur(r)]);
    const csv=[h,...rows].map(r=>r.map(v=>`"${v??""}"`).join(",")).join("\n");
    const blob=new Blob(["\uFEFF"+csv],{type:"text/csv;charset=utf-8;"});
    const url=URL.createObjectURL(blob);
    const a=document.createElement("a");a.href=url;a.download=`emre-${filterMonth||"all"}.csv`;a.click();
    toast("CSV 내보내기 완료 ✓");
  }
  function importFile(e){
    const file=e.target.files[0];if(!file)return;
    const reader=new FileReader();
    reader.onload=ev=>{
      try{
        const content=ev.target.result;
        if(file.name.endsWith(".json")){
          const parsed=JSON.parse(content);
          if(!Array.isArray(parsed)){toast("올바른 파일이 아닙니다","err");return;}
          if(!window.confirm(`${parsed.length}개 기록을 가져올까요? (기존 데이터와 합쳐집니다)`))return;
          const migrated=parsed.map((r,i)=>migrateRecord(r,i));
          setRecords(prev=>{const ids=new Set(prev.map(r=>r.id));return[...prev,...migrated.filter(r=>!ids.has(r.id))];});
          toast(`${parsed.length}개 가져오기 완료 ✓`);
        }else{
          const lines=content.split("\n").map(l=>l.trim()).filter(l=>l);
          const parse=line=>{const r=[];let c="",q=false;for(const ch of line){if(ch==='"'){q=!q;}else if(ch===","&&!q){r.push(c.trim());c="";}else c+=ch;}r.push(c.trim());return r;};
          const parsed=[];
          for(let i=1;i<lines.length;i++){
            const cols=parse(lines[i]);
            if(cols.length<4)continue;
            const g=n=>n<cols.length?(cols[n]||"").replace(/^"|"$/g,"").trim():"";
            parsed.push({id:Date.now()+i,date:g(0),tourName:g(1),pax:g(2),dailyWage:g(3),memo:g(cols.length-5)||""});
          }
          if(!parsed.length){toast("읽을 수 있는 데이터가 없습니다","err");return;}
          if(!window.confirm(`${parsed.length}개 기록을 가져올까요?`))return;
          setRecords(prev=>[...prev,...parsed]);
          toast(`${parsed.length}개 가져오기 완료 ✓`);
        }
      }catch{toast("파일을 읽을 수 없습니다","err");}
    };
    reader.readAsText(file,"UTF-8");
    e.target.value="";
  }

                      </div>
                      <span style={{fontSize:11,color:"#475569"}}>×€{item.rate}</span>
                      <span style={{fontSize:13,fontWeight:700,color:amt>0?"#fbbf24":"#475569",minWidth:48,textAlign:"right"}}>{amt>0?fmt(amt):"—"}</span>
                    </div>
                  </div>
                  <div style={{fontSize:10,color:"#475569",textAlign:"right",marginTop:2}}>인당 €{item.rate} 고정</div>
                </div>
              );
            })}
            {/* 추가 옵션 항목 */}
            {(form.extraOpt||[]).length>0&&<div style={{borderTop:"1px dashed var(--border)",paddingTop:10,marginTop:4,marginBottom:6}}><span style={{fontSize:10,color:"#fbbf24"}}>추가 옵션</span></div>}
            <ExtraItems
              items={form.extraOpt||[]}
              onChange={v=>setForm(f=>({...f,extraOpt:v.map(i=>({...i,amount:pf(i.pax)>0&&pf(i.manualRate)>0?String(pf(i.pax)*pf(i.manualRate)):i.amount}))}))}
              color="#fbbf24" withPax={true}
              addLabel="+ 옵션 추가"
            />
          </Accordion>

          <Accordion title="🛍 쇼핑 인센티브" total={tShop(form)} color="#a78bfa" accent="#7c3aed" badge="Shopping">
            <div style={{fontSize:10,color:"var(--sub)",marginBottom:10}}>상품별 인센티브 입력</div>
            {SHOP.map(item=><InputRow key={item.key} label={item.label} value={form[item.key]} onChange={setF(item.key)} color="#a78bfa"/>)}
            {/* 추가 쇼핑 항목 */}
            {(form.extraShop||[]).length>0&&<div style={{borderTop:"1px dashed var(--border)",paddingTop:10,marginTop:4,marginBottom:6}}><span style={{fontSize:10,color:"#a78bfa"}}>추가 쇼핑</span></div>}
            <ExtraItems items={form.extraShop||[]} onChange={v=>setForm(f=>({...f,extraShop:v}))} color="#a78bfa" addLabel="+ 쇼핑 추가"/>
          </Accordion>

          <Accordion title="💝 TIP / 기타 수입" total={tTip(form)} color="#34d399" accent="#059669" badge="Tip">
            <InputRow label="💝 TIP (€)" value={form.tip} onChange={setF("tip")} color="#34d399"/>
            {(form.extraTip||[]).length>0&&<div style={{borderTop:"1px dashed var(--border)",paddingTop:10,marginTop:4,marginBottom:6}}><span style={{fontSize:10,color:"#34d399"}}>추가 항목</span></div>}
            <ExtraItems items={form.extraTip||[]} onChange={v=>setForm(f=>({...f,extraTip:v}))} color="#34d399" addLabel="+ 항목 추가"/>
          </Accordion>

          <Accordion title="📤 지출 / 경비" total={tExp(form)} color="#f87171" accent="#dc2626" badge="Expense">
            {EXP.map(item=><InputRow key={item.key} label={item.label} value={form[item.key]} onChange={setF(item.key)} color="#f87171"/>)}
            {/* 추가 지출 항목 */}
            {(form.extraExp||[]).length>0&&<div style={{borderTop:"1px dashed var(--border)",paddingTop:10,marginTop:4,marginBottom:6}}><span style={{fontSize:10,color:"#f87171"}}>추가 지출</span></div>}
            <ExtraItems items={form.extraExp||[]} onChange={v=>setForm(f=>({...f,extraExp:v}))} color="#f87171" addLabel="+ 지출 추가"/>
          </Accordion>

          <div style={{marginBottom:12}}>
            <label style={{fontSize:11,color:"var(--sub)",fontWeight:600,display:"block",marginBottom:5}}>메모</label>
            <textarea style={{...inp,minHeight:68,resize:"vertical"}} placeholder="특이사항, 메모..." value={form.memo} onChange={e=>setF("memo")(e.target.value)}/>
          </div>

          {/* 순수익 미리보기 */}
          <div style={{background:"var(--bg3)",borderRadius:12,padding:"12px 14px",marginBottom:14,border:"1px solid #1e3a5f",display:"flex",justifyContent:"space-between",alignItems:"center"}}>
            <span style={{fontSize:13,color:"var(--sub)"}}>예상 순수익</span>
            <div style={{textAlign:"right"}}>
              <div style={{fontSize:18,fontWeight:800,color:(tInc(form)-tExp(form))>=0?"#34d399":"#f87171"}}>{fmt(tInc(form)-tExp(form))}</div>
              {eurRate&&<div style={{fontSize:11,color:"var(--sub)"}}>{fmt((tInc(form)-tExp(form))*eurRate,"KRW")}</div>}
            </div>
          </div>
          <button style={{width:"100%",background:"linear-gradient(135deg,#f59e0b,#d97706)",border:"none",borderRadius:12,padding:"14px",color:"#0f172a",fontSize:15,fontWeight:800,cursor:"pointer"}} onClick={saveRecord}>저장하기</button>
          <button style={{width:"100%",background:"var(--bg2)",border:"1px solid var(--border)",borderRadius:12,padding:"12px",color:"var(--sub)",fontSize:14,cursor:"pointer",marginTop:8}} onClick={()=>setView("list")}>취소</button>
        </div>
      )}

      {/* ══ DETAIL ══ */}
      {view==="detail"&&detailRec&&(
        <div style={{padding:16}}>
          <div style={{fontSize:18,fontWeight:800,color:"var(--text)",marginBottom:2}}>{detailRec.tourName}</div>
          <div style={{fontSize:12,color:"var(--sub)",marginBottom:18}}>{fmtDate(detailRec.date)}{detailRec.pax?` · ${detailRec.pax}명`:""}{detailRec.days&&pf(detailRec.days)>1?` · ${detailRec.days}일`:""}</div>
          <div style={{borderBottom:"1px solid var(--border)",padding:"11px 0",display:"flex",justifyContent:"space-between"}}>
            <span style={{fontSize:13,color:"var(--sub)"}}>💼 일당</span>
            <div style={{textAlign:"right"}}>
              <div style={{fontSize:13,color:"#60a5fa",fontWeight:700}}>{fmt(detailRec.dailyWage||0)}</div>
              {eurRate&&pf(detailRec.dailyWage)>0&&<div style={{fontSize:10,color:"var(--sub)"}}>{fmt(pf(detailRec.dailyWage)*eurRate,"KRW")}</div>}
            </div>
          </div>
          <DetailAcc title="⭐ 옵션 인센티브" total={tOpt(detailRec)}
            items={[
              ...OPT.map(i=>i.rate?{...i,label:`${i.label}(${pf(detailRec[i.paxKey])||0}명×€${i.rate})`}:i),
              ...(detailRec.extraOpt||[]).map(i=>({key:`x_${i.id}`,label:i.label||"추가옵션",_val:pf(i.amount)}))
            ]}
            rec={{...detailRec,...Object.fromEntries((detailRec.extraOpt||[]).map(i=>[`x_${i.id}`,i.amount]))}}
            eurRate={eurRate} color="#fbbf24" accent="#d97706"/>
          <DetailAcc title="🛍 쇼핑 인센티브" total={tShop(detailRec)}
            items={[...SHOP,...(detailRec.extraShop||[]).map(i=>({key:`x_${i.id}`,label:i.label||"추가쇼핑"}))]}
            rec={{...detailRec,...Object.fromEntries((detailRec.extraShop||[]).map(i=>[`x_${i.id}`,i.amount]))}}
            eurRate={eurRate} color="#a78bfa" accent="#7c3aed"/>
          <DetailAcc title="💝 TIP / 기타" total={tTip(detailRec)}
            items={[{key:"tip",label:"💝 TIP"},{key:"otherIncome",label:"✦ 기타"},...(detailRec.extraTip||[]).map(i=>({key:`x_${i.id}`,label:i.label||"추가항목"}))]}
            rec={{...detailRec,...Object.fromEntries((detailRec.extraTip||[]).map(i=>[`x_${i.id}`,i.amount]))}}
            eurRate={eurRate} color="#34d399" accent="#059669"/>
          <DetailAcc title="📤 지출 / 경비" total={tExp(detailRec)}
            items={[...EXP,...(detailRec.extraExp||[]).map(i=>({key:`x_${i.id}`,label:i.label||"추가지출"}))]}
            rec={{...detailRec,...Object.fromEntries((detailRec.extraExp||[]).map(i=>[`x_${i.id}`,i.amount]))}}
            eurRate={eurRate} color="#f87171" accent="#dc2626"/>
          <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginTop:12,background:"linear-gradient(135deg,#1a3055,#1e293b)",borderRadius:14,padding:"14px 16px",border:"1px solid #2d4a6b"}}>
            <span style={{fontSize:14,fontWeight:700,color:"#f1f5f9"}}>순수익</span>
            <div style={{textAlign:"right"}}>
              <div style={{fontSize:22,fontWeight:800,color:netEur(detailRec)>=0?"#34d399":"#f87171"}}>{fmt(netEur(detailRec))}</div>
              {eurRate&&<div style={{fontSize:12,color:"#64748b"}}>{fmt(netEur(detailRec)*eurRate,"KRW")}</div>}
              {detailRec.days&&pf(detailRec.days)>0&&<div style={{fontSize:11,color:"#64748b",marginTop:2}}>{fmt(Math.round(netEur(detailRec)/pf(detailRec.days)))}/일</div>}
            </div>
          </div>
          {detailRec.memo&&<div style={{marginTop:14,background:"var(--bg2)",borderRadius:12,padding:"12px 14px"}}><div style={{fontSize:11,color:"var(--sub)",marginBottom:5}}>메모</div><div style={{fontSize:13,color:"var(--text)",lineHeight:1.6}}>{detailRec.memo}</div></div>}
          <button style={{width:"100%",background:"linear-gradient(135deg,#f59e0b,#d97706)",border:"none",borderRadius:12,padding:"14px",color:"#0f172a",fontSize:15,fontWeight:800,cursor:"pointer",marginTop:20}} onClick={()=>openEdit(detailRec)}>✏️ 수정하기</button>
        </div>
      )}

      {/* ══ STATS ══ */}
      {view==="stats"&&(()=>{
        const allInc=records.reduce((s,r)=>s+tInc(r),0);
        const pieData=[
          {label:"💼 일당",  value:records.reduce((s,r)=>s+pf(r.dailyWage),0),color:"#60a5fa"},
          {label:"⭐ 옵션",  value:records.reduce((s,r)=>s+tOpt(r),0),       color:"#fbbf24"},
          {label:"🛍 쇼핑",  value:records.reduce((s,r)=>s+tShop(r),0),      color:"#a78bfa"},
          {label:"💝 팁/기타",value:records.reduce((s,r)=>s+tTip(r),0),      color:"#34d399"},
        ].filter(d=>d.value>0);

        // 쇼핑 상품별 순위
        const shopRank=SHOP.map(i=>({label:i.label,value:records.reduce((s,r)=>s+pf(r[i.key]),0)})).filter(d=>d.value>0).sort((a,b)=>b.value-a.value);
        // 옵션 상품별 순위
        const optRank=OPT.map(i=>({label:i.label,value:records.reduce((s,r)=>s+pf(r[i.key]),0)})).filter(d=>d.value>0).sort((a,b)=>b.value-a.value);
        // 인원당 평균
        const totalPax=records.reduce((s,r)=>s+parseInt(r.pax||0),0);
        const perPax=totalPax>0?Math.round(records.reduce((s,r)=>s+netEur(r),0)/totalPax):0;
        // 투어별
        const tourMap={};
        records.forEach(r=>{if(!tourMap[r.tourName])tourMap[r.tourName]={name:r.tourName,count:0,net:0,pax:0};tourMap[r.tourName].count++;tourMap[r.tourName].net+=netEur(r);tourMap[r.tourName].pax+=parseInt(r.pax||0);});
        const tourRank=Object.values(tourMap).sort((a,b)=>b.net-a.net).slice(0,8);
        // 일단위
        const dayRank=records.filter(r=>pf(r.days||1)>0).map(r=>({date:r.date,name:r.tourName,days:pf(r.days||1),net:netEur(r),perDay:netEur(r)/pf(r.days||1),pax:r.pax})).sort((a,b)=>b.perDay-a.perDay).slice(0,8);
        // 월별
        const monthStats=months.slice(0,6).map(m=>{
          const recs=records.filter(r=>monthKey(r.date)===m);
          return{m,count:recs.length,pax:recs.reduce((s,r)=>s+parseInt(r.pax||0),0),wage:recs.reduce((s,r)=>s+pf(r.dailyWage),0),option:recs.reduce((s,r)=>s+tOpt(r),0),shopping:recs.reduce((s,r)=>s+tShop(r),0),tip:recs.reduce((s,r)=>s+tTip(r),0),expense:recs.reduce((s,r)=>s+tExp(r),0),net:recs.reduce((s,r)=>s+netEur(r),0)};
        });
        // 연간 비교
        const thisYear=new Date().getFullYear();
        const lastYear=thisYear-1;
        const yearNet=(y)=>records.filter(r=>r.date&&r.date.startsWith(String(y))).reduce((s,r)=>s+netEur(r),0);
        const [tyNet,lyNet]=[yearNet(thisYear),yearNet(lastYear)];

        return(
          <div style={{padding:"12px 14px",paddingBottom:90}}>
            <div style={{fontSize:16,fontWeight:800,color:"var(--text)",marginBottom:12}}>📈 수익 통계</div>
            {/* 탭 */}
            <div style={{display:"flex",gap:5,marginBottom:14,background:"var(--bg3)",borderRadius:10,padding:4}}>
              {["overview","monthly","tour","daily"].map(t=>(
                <button key={t} style={tabBtn(t)} onClick={()=>setStatTab(t)}>
                  {t==="overview"?"개요":t==="monthly"?"월별":t==="tour"?"투어별":"일단위"}
                </button>
              ))}
            </div>

            {/* 개요 */}
            {statTab==="overview"&&<>
              {/* 인원당 평균 */}
              <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:8,marginBottom:12}}>
                <div style={{...chartCard,marginBottom:0,textAlign:"center"}}>
                  <div style={{fontSize:10,color:"var(--sub)",marginBottom:4}}>👤 인원당 평균 수익</div>
                  <div style={{fontSize:18,fontWeight:800,color:"#34d399"}}>{fmt(perPax)}</div>
                  {eurRate&&<div style={{fontSize:10,color:"var(--sub)"}}>{fmt(perPax*eurRate,"KRW")}</div>}
                </div>
                <div style={{...chartCard,marginBottom:0,textAlign:"center"}}>
                  <div style={{fontSize:10,color:"var(--sub)",marginBottom:4}}>📅 연간 비교</div>
                  <div style={{fontSize:13,fontWeight:700,color:"#f1f5f9"}}>{thisYear}: {fmt(tyNet)}</div>
                  <div style={{fontSize:11,color:"var(--sub)"}}>{lastYear}: {fmt(lyNet)}</div>
                  {tyNet>lyNet?<div style={{fontSize:10,color:"#34d399",marginTop:2}}>▲ {fmt(tyNet-lyNet)} 증가</div>
                    :tyNet<lyNet?<div style={{fontSize:10,color:"#f87171",marginTop:2}}>▼ {fmt(lyNet-tyNet)} 감소</div>:null}
                </div>
              </div>
              <div style={chartCard}>
                <div style={{fontSize:12,color:"var(--sub)",fontWeight:600,marginBottom:14}}>수입 항목별 비율</div>
                <PieChart data={pieData}/>
              </div>
              <div style={chartCard}>
                <div style={{fontSize:12,color:"var(--sub)",fontWeight:600,marginBottom:12}}>월별 순수익 추이</div>
                <BarChart data={chartData}/>
              </div>
              {/* 옵션/쇼핑 순위 */}
              <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:8}}>
                <div style={{...chartCard,marginBottom:0}}>
                  <div style={{fontSize:11,color:"#fbbf24",fontWeight:600,marginBottom:10}}>⭐ 옵션 순위</div>
                  {optRank.length===0?<div style={{fontSize:11,color:"var(--sub)",textAlign:"center"}}>없음</div>
                    :optRank.map((o,i)=>(
                      <div key={i} style={{marginBottom:6}}>
                        <div style={{fontSize:11,color:"var(--text)",fontWeight:600}}>{o.label}</div>
                        <div style={{fontSize:12,color:"#fbbf24",fontWeight:700}}>{fmt(o.value)}</div>
                      </div>
                    ))}
                </div>
                <div style={{...chartCard,marginBottom:0}}>
                  <div style={{fontSize:11,color:"#a78bfa",fontWeight:600,marginBottom:10}}>🛍 쇼핑 순위</div>
                  {shopRank.length===0?<div style={{fontSize:11,color:"var(--sub)",textAlign:"center"}}>없음</div>
                    :shopRank.map((o,i)=>(
                      <div key={i} style={{marginBottom:6}}>
                        <div style={{fontSize:11,color:"var(--text)",fontWeight:600}}>{o.label}</div>
                        <div style={{fontSize:12,color:"#a78bfa",fontWeight:700}}>{fmt(o.value)}</div>
                      </div>
                    ))}
                </div>
              </div>
            </>}

            {/* 월별 */}
            {statTab==="monthly"&&<div style={chartCard}>
              <div style={{fontSize:12,color:"var(--sub)",fontWeight:600,marginBottom:12}}>월별 상세 비교</div>
              {monthStats.length===0&&<div style={{color:"var(--sub)",fontSize:13,textAlign:"center",padding:20}}>데이터 없음</div>}
              {monthStats.map(m=>(
                <div key={m.m} style={{marginBottom:14,paddingBottom:14,borderBottom:"1px solid var(--border)"}}>
                  <div style={{display:"flex",justifyContent:"space-between",marginBottom:8}}>
                    <span style={{fontSize:13,fontWeight:700,color:"var(--text)"}}>{parseInt(m.m.slice(5))}월 {m.m.slice(0,4)}</span>
                    <span style={{fontSize:14,fontWeight:800,color:m.net>=0?"#34d399":"#f87171"}}>{fmt(m.net)}</span>
                  </div>
                  <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:6}}>
                    {[{label:"투어수",val:`${m.count}건`,c:"var(--sub)"},{label:"인원",val:`${m.pax}명`,c:"var(--sub)"},{label:"💼일당",val:fmt(m.wage),c:"#60a5fa"},{label:"⭐옵션",val:fmt(m.option),c:"#fbbf24"},{label:"🛍쇼핑",val:fmt(m.shopping),c:"#a78bfa"},{label:"💝팁",val:fmt(m.tip),c:"#34d399"},{label:"📤지출",val:fmt(m.expense),c:"#f87171"},eurRate?{label:"순수익₩",val:fmt(m.net*eurRate,"KRW"),c:"#34d399"}:null].filter(Boolean).map(({label,val,c})=>(
                      <div key={label} style={{background:"rgba(10,22,40,0.4)",borderRadius:8,padding:"6px 10px"}}>
                        <div style={{fontSize:10,color:"var(--sub)",marginBottom:2}}>{label}</div>
                        <div style={{fontSize:12,fontWeight:700,color:c}}>{val}</div>
                      </div>
                    ))}
                  </div>
                </div>
              ))}
            </div>}

            {/* 투어별 */}
            {statTab==="tour"&&<div style={chartCard}>
              <div style={{fontSize:12,color:"var(--sub)",fontWeight:600,marginBottom:12}}>투어별 평균 수익</div>
              {tourRank.length===0&&<div style={{color:"var(--sub)",fontSize:13,textAlign:"center",padding:20}}>데이터 없음</div>}
              {tourRank.map((t,i)=>(
                <div key={t.name} style={{display:"flex",justifyContent:"space-between",alignItems:"center",padding:"10px 0",borderBottom:"1px solid var(--border)"}}>
                  <div style={{flex:1,marginRight:8}}>
                    <div style={{display:"flex",alignItems:"center",gap:6}}>
                      <span style={{fontSize:10,color:"#475569",fontWeight:700,minWidth:16}}>#{i+1}</span>
                      <span style={{fontSize:12,fontWeight:700,color:"var(--text)"}}>{t.name}</span>
                    </div>
                    <div style={{fontSize:10,color:"var(--sub)",marginTop:2,marginLeft:22}}>{t.count}회 · {t.pax}명</div>
                  </div>
                  <div style={{textAlign:"right"}}>
                    <div style={{fontSize:13,fontWeight:800,color:"#34d399"}}>{fmt(Math.round(t.net/t.count))}<span style={{fontSize:9,color:"var(--sub)"}}>/회평균</span></div>
                    <div style={{fontSize:10,color:"var(--sub)"}}>총 {fmt(t.net)}</div>
                  </div>
                </div>
              ))}
            </div>}

            {/* 일단위 */}
            {statTab==="daily"&&<div style={chartCard}>
              <div style={{fontSize:12,color:"var(--sub)",fontWeight:600,marginBottom:4}}>일당 수익 순위</div>
              <div style={{fontSize:10,color:"#475569",marginBottom:12}}>순수익 ÷ 여행일수 기준</div>
              {dayRank.length===0&&<div style={{color:"var(--sub)",fontSize:13,textAlign:"center",padding:20}}>여행일수 입력된 데이터 없음</div>}
              {dayRank.map((d,i)=>(
                <div key={i} style={{display:"flex",justifyContent:"space-between",alignItems:"center",padding:"10px 0",borderBottom:"1px solid var(--border)"}}>
                  <div style={{flex:1,marginRight:8}}>
                    <div style={{display:"flex",alignItems:"center",gap:6}}>
                      <span style={{fontSize:10,color:"#475569",fontWeight:700,minWidth:16}}>#{i+1}</span>
                      <span style={{fontSize:12,fontWeight:700,color:"var(--text)"}}>{d.name}</span>
                    </div>
                    <div style={{fontSize:10,color:"var(--sub)",marginTop:2,marginLeft:22}}>{fmtDate(d.date)} · {d.days}일{d.pax?` · ${d.pax}명`:""}</div>
                  </div>
                  <div style={{textAlign:"right"}}>
                    <div style={{fontSize:13,fontWeight:800,color:"#fbbf24"}}>{fmt(Math.round(d.perDay))}<span style={{fontSize:9,color:"var(--sub)"}}>/일</span></div>
                    <div style={{fontSize:10,color:"var(--sub)"}}>총 {fmt(d.net)}</div>
                  </div>
                </div>
              ))}
            </div>}
          </div>
        );
      })()}

      {/* ══ SETTINGS ══ */}
      {view==="settings"&&(
        <div style={{padding:"14px 16px"}}>
          <div style={{fontSize:16,fontWeight:800,color:"var(--text)",marginBottom:16}}>⚙️ 설정</div>

          {/* 다크/라이트 모드 */}
          <div style={{background:"var(--card)",borderRadius:14,padding:"14px 16px",border:"1px solid var(--border)",marginBottom:12}}>
            <div style={{display:"flex",justifyContent:"space-between",alignItems:"center"}}>
              <div>
                <div style={{fontSize:14,fontWeight:700,color:"var(--text)"}}>🌙 다크 모드</div>
                <div style={{fontSize:11,color:"var(--sub)",marginTop:2}}>화면 밝기 조절</div>
              </div>
              <div onClick={()=>setDarkMode(v=>!v)} style={{width:48,height:26,borderRadius:13,background:darkMode?"#f59e0b":"#334155",cursor:"pointer",position:"relative",transition:"background 0.2s"}}>
                <div style={{position:"absolute",top:3,left:darkMode?24:3,width:20,height:20,borderRadius:10,background:"#fff",transition:"left 0.2s"}}/>
              </div>
            </div>
          </div>

          {/* 월 목표 수입 */}
          <div style={{background:"var(--card)",borderRadius:14,padding:"14px 16px",border:"1px solid var(--border)",marginBottom:12}}>
            <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:showGoalInput?12:0}}>
              <div>
                <div style={{fontSize:14,fontWeight:700,color:"var(--text)"}}>🎯 월 목표 수입</div>
                <div style={{fontSize:11,color:"var(--sub)",marginTop:2}}>{monthGoal>0?`현재 목표: ${fmt(monthGoal)}`:"목표 미설정"}</div>
              </div>
              <button onClick={()=>setShowGoalInput(v=>!v)} style={{background:"#1e3a5f",border:"1px solid #2d4a6b",borderRadius:8,padding:"6px 12px",color:"#f59e0b",fontSize:12,cursor:"pointer"}}>
                {showGoalInput?"닫기":"설정"}
              </button>
            </div>
            {showGoalInput&&(
              <div style={{display:"flex",gap:8}}>
                <div style={{display:"flex",alignItems:"center",flex:1,background:"var(--bg2)",border:"1px solid var(--border)",borderRadius:10,padding:"0 12px"}}>
                  <span style={{color:"#475569"}}>€</span>
                  <input type="number" inputMode="numeric" placeholder="예: 3000" defaultValue={monthGoal||""}
                    onBlur={e=>{const v=pf(e.target.value);setMonthGoal(v);saveLS(SK_GOAL,v);toast(v>0?`목표 ${fmt(v)} 설정 ✓`:"목표 해제 ✓");}}
                    style={{flex:1,background:"transparent",border:"none",padding:"11px 8px",color:"var(--text)",fontSize:14,outline:"none"}}/>
                </div>
                <button onClick={()=>{setMonthGoal(0);saveLS(SK_GOAL,0);toast("목표 해제 ✓");setShowGoalInput(false);}} style={{background:"transparent",border:"1px solid #ef4444",borderRadius:10,padding:"0 12px",color:"#ef4444",fontSize:12,cursor:"pointer"}}>해제</button>
              </div>
            )}
          </div>

          {/* 백업/복원 */}
          <div style={{background:"var(--card)",borderRadius:14,padding:"14px 16px",border:"1px solid var(--border)",marginBottom:12}}>
            <div style={{fontSize:14,fontWeight:700,color:"var(--text)",marginBottom:12}}>💾 데이터 관리</div>
            <div style={{display:"flex",gap:8,flexWrap:"wrap"}}>
              <button onClick={exportJSON} style={{flex:1,background:"#1e3a5f",border:"1px solid #2d4a6b",borderRadius:10,padding:"10px",color:"#60a5fa",fontSize:12,cursor:"pointer",fontWeight:600}}>📤 백업 저장</button>
              <label style={{flex:1,background:"#1e3a5f",border:"1px solid #2d4a6b",borderRadius:10,padding:"10px",color:"#34d399",fontSize:12,cursor:"pointer",fontWeight:600,textAlign:"center"}}>
                📥 데이터 가져오기<input type="file" accept=".json,.csv" onChange={importFile} style={{display:"none"}}/>
              </label>
            </div>
            <button onClick={exportCSV} style={{width:"100%",marginTop:8,background:"transparent",border:"1px solid var(--border)",borderRadius:10,padding:"10px",color:"var(--sub)",fontSize:12,cursor:"pointer"}}>📊 CSV 내보내기</button>
            <div style={{fontSize:10,color:"var(--sub)",marginTop:10,textAlign:"center"}}>총 {records.length}개 기록 저장됨</div>
          </div>

          {/* 앱 정보 */}
          <div style={{background:"var(--card)",borderRadius:14,padding:"14px 16px",border:"1px solid var(--border)"}}>
            <div style={{fontSize:14,fontWeight:700,color:"var(--text)",marginBottom:8}}>ℹ️ 앱 정보</div>
            <div style={{fontSize:12,color:"var(--sub)",lineHeight:1.8}}>
              <div>🌍 Emre 계산기 v3.0</div>
              <div>🔒 모든 데이터는 이 기기에만 저장</div>
              <div>💱 환율: 유럽중앙은행 기준 (1일 1회)</div>
            </div>
          </div>
        </div>
      )}

      {/* FAB */}
      {isListLike&&<button style={{position:"fixed",bottom:70,right:"calc(50% - 200px)",background:"linear-gradient(135deg,#f59e0b,#d97706)",border:"none",borderRadius:28,width:52,height:52,fontSize:24,color:"#0f172a",cursor:"pointer",display:"flex",alignItems:"center",justifyContent:"center",boxShadow:"0 4px 20px rgba(245,158,11,0.4)",zIndex:99}} onClick={openAdd}>＋</button>}

      {/* 하단 네비 */}
      <div style={{position:"fixed",bottom:0,left:"50%",transform:"translateX(-50%)",width:"100%",maxWidth:430,background:"var(--bg)",borderTop:"1px solid var(--border)",display:"flex",zIndex:100}}>
        {[{id:"list",icon:"📋",label:"기록"},{id:"stats",icon:"📈",label:"통계"},{id:"settings",icon:"⚙️",label:"설정"}].map(({id,icon,label})=>{
          const active=view===id||(view==="detail"&&id==="list")||(view==="add"&&id==="list");
          return(
            <button key={id} style={{flex:1,padding:"10px 0 8px",display:"flex",flexDirection:"column",alignItems:"center",gap:3,cursor:"pointer",border:"none",background:"transparent",color:active?"#f59e0b":"var(--sub)",fontSize:10,fontWeight:active?700:400}} onClick={()=>setView(id)}>
              <span style={{fontSize:20}}>{icon}</span><span>{label}</span>
            </button>
          );
        })}
      </div>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App/>);
</script>
<script>
if("serviceWorker"in navigator){
  const sw=`const C="emre-v3";self.addEventListener("install",e=>{self.skipWaiting();});self.addEventListener("activate",e=>{e.waitUntil(caches.keys().then(k=>Promise.all(k.filter(n=>n!==C).map(n=>caches.delete(n)))));self.clients.claim();});self.addEventListener("fetch",e=>{e.respondWith(fetch(e.request).catch(()=>caches.match(e.request)));});`;
  const blob=new Blob([sw],{type:"application/javascript"});
  navigator.serviceWorker.register(URL.createObjectURL(blob)).catch(()=>{});
}
</script>
</body>
</html>
